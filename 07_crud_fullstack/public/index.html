<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Mahasiswa - JavaScript & MySQL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>CRUD Mahasiswa</h2>
    <div id="notif" class="notif" hidden></div>

    <form id="mhsForm" class="card">
        <input type="hidden" id="mhsId">
        <h3 id="formTitle">Tambah Mahasiswa</h3>
        <div class="row">
            <label>NIM
                <input id="nim" required placeholder="Contoh: 240101003">
            </label>
            <label>Nama Lengkap
                <input id="nama" required placeholder="Nama mahasiswa">
            </label>
        </div>
        <div class="row">
            <label>Jurusan
                <select id="jurusan" required>
                    <option value="">-- Pilih Jurusan --</option>
                    <option>Teknik Informatika</option>
                    <option>Sistem Informasi</option>
                    <option>Manajemen Informatika</option>
                </select>
            </label>
            <label>Email
                <input id="email" type="email" required placeholder="nama@kampus.ac.id">
            </label>
        </div>
        <div class="actions">
            <button id="btnSubmit" class="btn primary" type="submit">Simpan</button>
            <button id="btnCancel" class="btn" type="button" hidden>Batal Edit</button>
        </div>
    </form>

    <div class="card">
        <div class="table-top">
            <h3>Daftar Mahasiswa</h3>
            <!-- Fitur 3: counter total mahasiswa -->
            <p id="mhsCount">Total Mahasiswa Terdaftar: 0 Orang</p>
        </div>
        <!-- Fitur 1: pencarian real-time -->
        <input id="searchInput" class="search" type="text" placeholder="Cari berdasarkan nama atau NIM...">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIM</th>
                    <th>Nama Lengkap</th>
                    <th>Jurusan</th>
                    <th>Email</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="mhsTableBody"></tbody>
        </table>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
